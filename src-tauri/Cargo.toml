[package]
name = "sunshine-app"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
url = "2"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString"] }
