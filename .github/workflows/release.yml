name: Release Sunshine

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
        type: string
      url:
        description: "Sunshine URL"
        required: true
        default: "https://localhost:47990"
        type: string
      username:
        description: "Sunshine username (Basic Auth)"
        required: true
        default: "admin"
        type: string
      password:
        description: "Sunshine password (Basic Auth)"
        required: true
        default: "admin"
        type: string
      icon:
        description: "Icon URL (PNG/SVG/ICO)"
        required: false
        default: "https://raw.githubusercontent.com/SunshineStream/Sunshine/refs/heads/master/sunshine.svg"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Prepare icons
        shell: pwsh
        env:
          ICON_URL: ${{ inputs.icon }}
        run: |
          if ($IsMacOS -and -not (Get-Command magick -ErrorAction SilentlyContinue)) {
            brew install imagemagick
          }
          $pngPath = Join-Path $env:TEMP "sunshine_512.png"
          $ok = $false
          if (-not [string]::IsNullOrWhiteSpace($env:ICON_URL)) {
            try {
              $ext = [System.IO.Path]::GetExtension(($env:ICON_URL -split '\?')[0])
              if ([string]::IsNullOrEmpty($ext)) { $ext = ".png" }
              $rawIcon = Join-Path $env:TEMP "sunshine_icon$ext"
              Invoke-WebRequest -Uri $env:ICON_URL -OutFile $rawIcon -UseBasicParsing
              magick -background none -density 512 $rawIcon -resize 512x512 -gravity center -extent 512x512 $pngPath
              if (Test-Path $pngPath) { $ok = $true }
            } catch {
              Write-Warning "Failed to download/convert icon: $_"
            }
          }
          if (-not $ok) {
            magick -size 512x512 xc:#FF9900 $pngPath
          }
          npx --yes @tauri-apps/cli@^2 icon $pngPath

      - name: Build bundle
        shell: pwsh
        env:
          SUNSHINE_URL: ${{ inputs.url }}
          SUNSHINE_USER: ${{ inputs.username }}
          SUNSHINE_PASS: ${{ inputs.password }}
          SUNSHINE_HOSTS: "localhost,127.0.0.1"
        run: |
          npx --yes @tauri-apps/cli@^2 build

      - name: Upload Windows MSI
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Sunshine-Windows
          path: src-tauri/target/release/bundle/msi/*.msi
          retention-days: 7

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Sunshine-macOS
          path: src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Sunshine ${{ inputs.tag }}
          body: |
            Desktop installers for Sunshine Web UI (Windows MSI & macOS DMG).
            - Target URL: `${{ inputs.url }}`
            - Embedded auto-login: `${{ inputs.username }}` / `${{ inputs.password }}`
          files: |
            artifacts/Sunshine-Windows/*.msi
            artifacts/Sunshine-macOS/*.dmg
          generate_release_notes: true
