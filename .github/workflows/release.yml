name: Release Sunshine (Windows)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "v1.0.0"
      url:
        description: "Sunshine URL"
        required: true
        default: "https://localhost:47990/config"
      username:
        description: "Sunshine username (Basic Auth)"
        required: true
        default: "admin"
      password:
        description: "Sunshine password (Basic Auth)"
        required: true
        default: "admin"
      icon:
        description: "Icon URL (PNG/SVG/ICO)"
        required: false
        default: "https://raw.githubusercontent.com/SunshineStream/Sunshine/refs/heads/master/sunshine.svg"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Prepare icon.ico
        shell: pwsh
        env:
          ICON_URL: ${{ inputs.icon }}
        run: |
          New-Item -ItemType Directory -Path "src-tauri/icons" -Force | Out-Null
          $ok = $false
          if (-not [string]::IsNullOrWhiteSpace($env:ICON_URL)) {
            try {
              $ext = [System.IO.Path]::GetExtension(($env:ICON_URL -split '\?')[0])
              if ([string]::IsNullOrEmpty($ext)) { $ext = ".png" }
              $rawIcon = Join-Path $env:TEMP "sunshine_icon$ext"
              Invoke-WebRequest -Uri $env:ICON_URL -OutFile $rawIcon -UseBasicParsing
              magick $rawIcon -background none -resize 256x256 -define icon:auto-resize=256,128,64,48,32,16 src-tauri/icons/icon.ico
              if (Test-Path "src-tauri/icons/icon.ico") { $ok = $true }
            } catch {
              Write-Warning "Failed to download/convert icon: $_"
            }
          }
          if (-not $ok) {
            magick -size 256x256 xc:#FF9900 -define icon:auto-resize=256,128,64,48,32,16 src-tauri/icons/icon.ico
          }

      - name: Build MSI
        shell: pwsh
        env:
          SUNSHINE_URL: ${{ inputs.url }}
          SUNSHINE_USER: ${{ inputs.username }}
          SUNSHINE_PASS: ${{ inputs.password }}
        run: |
          $targetHost = ([uri]$env:SUNSHINE_URL).Host
          $hosts = @("localhost", "127.0.0.1", $targetHost) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -Unique
          $env:SUNSHINE_HOSTS = ($hosts -join ",")
          npx --yes @tauri-apps/cli@^2 build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: "Sunshine ${{ inputs.tag }}"
          body: |
            Sunshine desktop wrapper for Windows:
            - Target URL: `${{ inputs.url }}`
            - Embedded Basic Auth: `${{ inputs.username }}` / `${{ inputs.password }}`
            - Self-signed certificate bypass enabled (`--ignore-certificate-errors`)
          files: src-tauri/target/release/bundle/msi/*.msi