name: Build Sunshine

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform"
        required: true
        default: "all"
        type: choice
        options:
          - "all"
          - "windows-latest"
          - "macos-latest"
      url:
        description: "Sunshine URL"
        required: true
        default: "https://localhost:47990"
        type: string
      username:
        description: "Sunshine username (Basic Auth)"
        required: true
        type: string
      password:
        description: "Sunshine password (Basic Auth)"
        required: true
        type: string
      icon:
        description: "Icon URL (PNG/SVG/ICO)"
        required: false
        default: "https://raw.githubusercontent.com/SunshineStream/Sunshine/refs/heads/master/sunshine.svg"
        type: string

permissions:
  contents: read

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.set.outputs.platforms }}
    steps:
      - id: set
        shell: bash
        run: |
          if [ "${{ inputs.platform }}" == "all" ]; then
            echo 'platforms=["windows-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'platforms=["${{ inputs.platform }}"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: prepare-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.prepare-matrix.outputs.platforms) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Prepare icons
        shell: pwsh
        env:
          ICON_URL: ${{ inputs.icon }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($IsMacOS -and -not (Get-Command magick -ErrorAction SilentlyContinue)) {
            brew install imagemagick
          }
          $tmpDir = [System.IO.Path]::GetTempPath()
          $pngPath = Join-Path $tmpDir "sunshine_512.png"
          $ok = $false
          if (-not [string]::IsNullOrWhiteSpace($env:ICON_URL)) {
            try {
              $ext = [System.IO.Path]::GetExtension(($env:ICON_URL -split '\?')[0])
              if ([string]::IsNullOrEmpty($ext)) { $ext = ".png" }
              $rawIcon = Join-Path $tmpDir "sunshine_icon$ext"
              Invoke-WebRequest -Uri $env:ICON_URL -OutFile $rawIcon -UseBasicParsing
              magick -background none -density 512 $rawIcon -resize 512x512 -gravity center -extent 512x512 $pngPath
              if ($LASTEXITCODE -eq 0 -and (Test-Path $pngPath)) { $ok = $true }
            } catch {
              Write-Warning "Failed to download/convert icon: $_"
            }
          }
          if (-not $ok) {
            magick -size 512x512 xc:#FF9900 $pngPath
          }
          npx --yes @tauri-apps/cli@^2 icon $pngPath

      - name: Build bundle
        shell: pwsh
        env:
          SUNSHINE_URL: ${{ inputs.url }}
          SUNSHINE_USER: ${{ inputs.username }}
          SUNSHINE_PASS: ${{ inputs.password }}
          SUNSHINE_HOSTS: "localhost,127.0.0.1"
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = if ($IsWindows) { "msi" } else { "dmg" }
          npx --yes @tauri-apps/cli@^2 build --bundles $bundle
          New-Item -ItemType Directory -Path "dist-release" -Force | Out-Null
          if ($IsWindows) {
            Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1 | Copy-Item -Destination "dist-release/SunshineApp-Windows-x64.msi"
          } else {
            Get-ChildItem "src-tauri/target/release/bundle/dmg/*.dmg" | Select-Object -First 1 | Copy-Item -Destination "dist-release/SunshineApp-macOS-AppleSilicon.dmg"
          }

      - name: Upload Windows MSI
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: SunshineApp-Windows
          path: dist-release/SunshineApp-Windows-x64.msi
          retention-days: 7

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: SunshineApp-macOS
          path: dist-release/SunshineApp-macOS-AppleSilicon.dmg
          retention-days: 7
