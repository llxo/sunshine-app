name: Build Sunshine

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform"
        required: true
        default: "all"
        type: choice
        options:
          - "all"
          - "windows-latest"
          - "macos-latest"
      url:
        description: "Sunshine URL"
        required: true
        default: "https://localhost:47990/config"
      username:
        description: "Sunshine username (Basic Auth)"
        required: true
        type: string
      password:
        description: "Sunshine password (Basic Auth)"
        required: true
        type: string
      icon:
        description: "Icon URL (PNG/SVG/ICO)"
        required: false
        default: "https://raw.githubusercontent.com/SunshineStream/Sunshine/refs/heads/master/sunshine.svg"

permissions:
  contents: read

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.set.outputs.platforms }}
    steps:
      - id: set
        shell: bash
        run: |
          if [ "${{ inputs.platform }}" == "all" ]; then
            echo 'platforms=["windows-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'platforms=["${{ inputs.platform }}"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: prepare-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.prepare-matrix.outputs.platforms) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Prepare icons
        shell: pwsh
        env:
          ICON_URL: ${{ inputs.icon }}
        run: |
          if ($IsMacOS -and -not (Get-Command magick -ErrorAction SilentlyContinue)) {
            brew install imagemagick
          }
          $pngPath = Join-Path $env:TEMP "sunshine_512.png"
          $ok = $false
          if (-not [string]::IsNullOrWhiteSpace($env:ICON_URL)) {
            try {
              $ext = [System.IO.Path]::GetExtension(($env:ICON_URL -split '\?')[0])
              if ([string]::IsNullOrEmpty($ext)) { $ext = ".png" }
              $rawIcon = Join-Path $env:TEMP "sunshine_icon$ext"
              Invoke-WebRequest -Uri $env:ICON_URL -OutFile $rawIcon -UseBasicParsing
              magick $rawIcon -background none -resize 512x512 $pngPath
              if (Test-Path $pngPath) { $ok = $true }
            } catch {
              Write-Warning "Failed to download/convert icon: $_"
            }
          }
          if (-not $ok) {
            magick -size 512x512 xc:#FF9900 $pngPath
          }
          npx --yes @tauri-apps/cli@^2 icon $pngPath

      - name: Build bundle
        shell: pwsh
        env:
          SUNSHINE_URL: ${{ inputs.url }}
          SUNSHINE_USER: ${{ inputs.username }}
          SUNSHINE_PASS: ${{ inputs.password }}
          SUNSHINE_HOSTS: "localhost,127.0.0.1"
        run: |
          npx --yes @tauri-apps/cli@^2 build

      - name: Upload Windows MSI
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Sunshine-Windows
          path: src-tauri/target/release/bundle/msi/*.msi
          retention-days: 7

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Sunshine-macOS
          path: src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 7
